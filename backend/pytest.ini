[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Unit tests must never require network access or Earth Engine credentials.
# Integration tests are deselected automatically by tests/conftest.py unless
# RUN_GEE_INTEGRATION_TESTS=1 is set in the environment.
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

markers =
    integration: requires Earth Engine credentials and internet access; skipped unless RUN_GEE_INTEGRATION_TESTS=1

asyncio_default_fixture_loop_scope = function

filterwarnings =
    error::DeprecationWarning:app.*
