version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agri_intelligence
    ports:
      - "5433:5432" # تغییر پورت سیستم‌عامل به 5433 برای جلوگیری از تداخل
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agri_intelligence
      - EE_PROJECT_ID=${EE_PROJECT_ID:-}
      - EE_SERVICE_ACCOUNT=${EE_SERVICE_ACCOUNT:-}
      - EE_PRIVATE_KEY_FILE=${EE_PRIVATE_KEY_FILE:-}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
    volumes:
      - ./backend:/app
      - ./credentials:/app/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # اصلاح پورت فرانت‌اند
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: pnpm dev --host
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000

volumes:
  postgres_data: